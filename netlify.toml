# No build step: index.html loads app/js/game.js as a native ES module and
# the browser resolves its whole import graph itself. The repo is published
# as-is.
[build]
  publish = "."

# Clean URLs for the admin tools: /label (label queue) and /label/browse
[[redirects]]
  from = "/label/browse"
  to   = "/tools/label/browse.html"
  status = 200

[[redirects]]
  from = "/label"
  to   = "/tools/label/index.html"
  status = 200

[[redirects]]
  from = "/label/"
  to   = "/tools/label/index.html"
  status = 200
